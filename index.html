<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary App Titles & Metas -->
    <title>BINTANG REMAJA - Sistem Absensi Kehadiran Karang Taruna</title>
    <meta name="title" content="BINTANG REMAJA - Sistem Absensi Kehadiran Karang Taruna" />
    <meta name="description" content="Sistem Absensi Kehadiran Karang Taruna berbasis Website/PWA dengan Deteksi Wajah Real-time & Liveness Verification." />
    
    <!-- iOS & Safari WebApp Metas -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bintang Remaja" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/star-logo.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/star-logo.svg" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="/star-logo.svg" />
    <link rel="mask-icon" href="/icon-maskable.svg" color="#8b5cf6" />
    <meta name="msapplication-TileColor" content="#15072b" />

    <!-- Google Identity Services for Google Sheets OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#0d071a] text-slate-100 antialiased font-['Poppins',sans-serif] select-none overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA Offline support and Android Install Prompt trigger
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(reg => {
              console.log('Bintang Remaja ServiceWorker registered:', reg.scope);
              reg.onupdatefound = () => {
                const installingWorker = reg.installing;
                if (installingWorker) {
                  installingWorker.onstatechange = () => {
                    if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      console.log('New update available for Bintang Remaja PWA.');
                    }
                  };
                }
              };
            })
            .catch(err => console.log('ServiceWorker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
